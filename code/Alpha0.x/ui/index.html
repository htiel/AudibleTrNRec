<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Audible Track and Recommend</title>
  <link rel="stylesheet" href="/ui/css/tokens.css">
  <link rel="stylesheet" href="/ui/css/base.css">
  <link rel="stylesheet" href="/ui/css/layout.css">
  <link rel="stylesheet" href="/ui/css/components.css">
  <link rel="stylesheet" href="/ui/css/theme-liquid-glass.css">
</head>
<body>
  <a class="lcars-skip-link" href="#main-content">Skip to main content</a>

  <div class="lcars-frame">
    <header class="lcars-header" role="banner">
      <div class="lcars-elbow lcars-elbow-top" aria-hidden="true"></div>
      <div class="lcars-header-bar">
        <h1 class="lcars-title">Audible Track and Recommend</h1>
        <p id="runtime-status" class="lcars-status-pill">Loading the active runtime mode…</p>
        <a class="lcars-icon-btn" href="#/settings" data-route="settings" aria-label="Settings">
          <span class="lcars-icon-gear" aria-hidden="true"></span>
        </a>
      </div>
    </header>

    <div class="lcars-body">
      <aside class="lcars-sidebar" aria-label="Application navigation and library controls">
        <nav class="lcars-sidebar-group" aria-label="Primary">
          <ul>
            <li><a href="#/library" data-route="library">Library</a></li>
          </ul>
        </nav>
        <div class="lcars-sidebar-filler">
          <div id="library-sidebar-controls"></div>
        </div>
        <nav class="lcars-sidebar-group" aria-label="Diagnostics and lifecycle">
          <ul>
            <li><a href="#/feasibility" data-route="feasibility">Feasibility &amp; trace</a></li>
            <li><a href="#/data" data-route="data">Data &amp; lifecycle</a></li>
            <li><a href="#/settings" data-route="settings">Settings</a></li>
          </ul>
        </nav>
      </aside>

      <main id="main-content" class="lcars-main" tabindex="-1">
        <div id="view-root"></div>
      </main>
    </div>

    <footer class="lcars-footer" role="contentinfo">
      <div class="lcars-footer-bar">
        <p id="runtime-footer">Loading the active runtime source…</p>
      </div>
      <div class="lcars-elbow lcars-elbow-bottom" aria-hidden="true"></div>
    </footer>
  </div>

  <div id="live-polite" class="lcars-sr-only" role="status" aria-live="polite"></div>
  <div id="live-assertive" class="lcars-sr-only" role="alert" aria-live="assertive"></div>

  <script type="module" src="/ui/js/app.js"></script>
</body>
</html>
