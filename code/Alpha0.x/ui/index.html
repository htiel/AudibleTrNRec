<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Audible Track and Recommend</title>
  <link rel="stylesheet" href="/ui/css/tokens.css">
  <link rel="stylesheet" href="/ui/css/base.css">
  <link rel="stylesheet" href="/ui/css/components.css">
  <!--
    The two theme-scoped stylesheets below are mutually exclusive: only
    one is ever enabled at a time, toggled by `js/theme-preference.js`'s
    `syncThemeStylesheets()` via the `.disabled` IDL property, keyed off
    `data-theme-scope`. LCARS is the default theme, so its sheets start
    enabled and the Apple/Liquid Glass sheet starts `disabled` in markup
    to avoid ever painting both themes' rules on first parse.
  -->
  <link rel="stylesheet" href="/ui/css/layout.css" data-theme-scope="lcars">
  <link rel="stylesheet" href="/ui/css/theme-lcars.css" data-theme-scope="lcars">
  <link rel="stylesheet" href="/ui/css/theme-liquid-glass.css" data-theme-scope="liquid-glass" disabled>
</head>
<body>
  <a class="atnr-skip-link" href="#main-content">Skip to main content</a>

  <!--
    Intentionally empty. Exactly one independent presentation shell is
    mounted here at runtime by `js/app.js`, chosen by the active theme:
    `js/shells/lcars-shell.js` (the original LCARS console chrome — elbows,
    swept sidebar, grey library-controls filler) or `js/shells/apple-shell.js`
    (a compact iPhone nav bar + bottom tab bar). Neither shell's markup is
    ever present in this document at the same time as the other's, and
    neither is built here as static HTML and then hidden with CSS — see
    `planning/0.0.2/13-independent-theme-ui-spec.md`.
  -->
  <div id="shell-root"></div>

  <div id="live-polite" class="lcars-sr-only" role="status" aria-live="polite"></div>
  <div id="live-assertive" class="lcars-sr-only" role="alert" aria-live="assertive"></div>

  <script type="module" src="/ui/js/app.js"></script>
</body>
</html>
